name: Build and Publish Typebot Builder & Viewer to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.app }}
    strategy:
      matrix:
        app: [builder, viewer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            SCOPE=${{ matrix.app }}
          target: release
          tags: |
            ghcr.io/${{ github.repository_owner }}/woofunnel-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/woofunnel-${{ matrix.app }}:${{ github.sha }}
